name: Codex cloud setup

on: push

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global @openai/codex@0.162.1
      - run: bash -n codex-cloud-setup.sh
      - run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          RUN_LINUX_INSTALL_TEST: '1'
